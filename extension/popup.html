<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MediaVault</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="brand">
    <span class="brand-mark" aria-hidden="true">M</span>
    <div>
      <h1>MediaVault</h1>
      <p>Playback companion</p>
    </div>
  </header>

  <section id="auth-section" class="panel" hidden>
    <h2>Sync your progress</h2>
    <p class="muted">Sign in to keep your watch history on all your devices.</p>
    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" placeholder="you@example.com" required />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Your password" required />
      <p id="auth-error" class="error" role="alert" aria-live="polite"></p>
      <button id="login-btn" type="submit">Sign in</button>
    </form>
    <button id="register-link" class="button secondary" type="button">Create account</button>
  </section>

  <section id="app-section" class="panel" hidden>
    <p id="user-greeting" class="greeting"></p>
    <div id="current-anime" class="now-playing">
      <p class="eyebrow">CONTINUE WATCHING</p>
      <h2 id="title">Nothing playing yet</h2>
      <p id="episode" class="muted"></p>
      <p id="time" class="watch-time"></p>
      <div class="progress-track" aria-hidden="true"><span id="progress-bar"></span></div>
      <p id="empty-state" class="muted">Start a video on Netflix or another supported site and your progress will show here.</p>
    </div>
    <p id="sync-status" class="sync-status" role="status" aria-live="polite"></p>
    <button id="continue-btn" type="button">Continue watching</button>
    <button id="dashboard-btn" class="button secondary" type="button">Open dashboard</button>
    <button id="logout-btn" class="text-button" type="button">Sign out</button>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
