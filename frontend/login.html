<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <title>Login — MediaVault</title>
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">
      <div class="nav-mark" aria-hidden="true">M</div>
      <div class="nav-logo">MediaVault</div>
    </div>
    <div class="nav-links">
      <a class="nav-item" href="/">Home</a>
      <a class="nav-item active" href="/login.html">Login</a>
      <a class="nav-item" href="/register.html">Register</a>
    </div>
  </nav>

  <div class="auth-container">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-subtitle">Sign in to sync your watch history</p>

      <form id="login-form" class="auth-form">
        <label>
          Email
          <input id="email" name="email" type="email" required maxlength="254" autocomplete="email" placeholder="you@example.com" />
        </label>

        <label>
          Password
          <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••" />
        </label>

        <p id="auth-error" class="auth-error" role="alert" aria-live="polite"></p>

        <button id="submit-btn" type="submit">Login</button>
      </form>

      <p class="auth-switch">
        No account?
        <a href="/register.html">Register</a>
      </p>
    </div>
  </div>

  <script type="module" src="/src/login.js"></script>
</body>
</html>
